name: Express API tests

on:
  pull_request:
    branches: [feat/express-server]

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - run: npm ci --no-audit --no-fund
      - run: npm test
